<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Burger Kingo</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
:root{--main:#ff4500;--bg:#f5f5f5}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:var(--bg)}
header{background:var(--main);color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:100}
#logo{width:60px;height:60px;border-radius:50%;background:#fff;object-fit:cover}
#cartBtn{position:fixed;bottom:20px;right:20px;background:var(--main);color:#fff;padding:15px 20px;border-radius:30px;border:none;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:100}
</style>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvetl-4f68ykb5GpGSZtCAvOeetKmnh-4",
  authDomain: "menu-digital-12e66.firebaseapp.com",
  databaseURL: "https://menu-digital-12e66-default-rtdb.firebaseio.com",
  projectId: "menu-digital-12e66",
  storageBucket: "menu-digital-12e66.firebasestorage.app",
  messagingSenderId: "388372771516",
  appId: "1:388372771516:web:516a80aeeecc1ab8f756b9",
  measurementId: "G-SBDX42X17X"
};
let db, menu={}, orders={}, cfg={name:"Burger Kingo",address:"Dolores Hidalgo",phone:"",color:"#ff4500",logoUrl:""}, logoUrl="", cart=[];
function save(){localStorage.setItem('menu',JSON.stringify(menu));localStorage.setItem('cfg',JSON.stringify(cfg));}
function renderHeader(){
 document.getElementById('bizName').innerText=cfg.name||"Burger Kingo";
 document.getElementById('bizAddr').innerText=cfg.address||"";
 document.documentElement.style.setProperty('--main', cfg.color||"#ff4500");
 document.getElementById('mainHeader').style.background=cfg.color;
 document.getElementById('cartBtn').style.background=cfg.color;
 document.getElementById('pageTitle').innerText=cfg.name;
 const l=document.getElementById('logo');
 if(cfg.logoUrl){l.src=cfg.logoUrl;l.style.display='inline-block';}else{l.style.display='none';}
}
function render(){
 const cont=document.getElementById('menuContainer');cont.innerHTML="";
 Object.keys(menu).forEach(cat=>{
   const h=document.createElement('h2');h.innerText=cat;h.style.margin="15px 0 10px";cont.appendChild(h);
   Object.keys(menu[cat]||{}).forEach(id=>{
     const p=menu[cat][id];
     const d=document.createElement('div');
     d.style="background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center";
     d.innerHTML=`<div><b>${p.name}</b><br><small>$${p.price}</small></div><button onclick="addToCart('${cat}','${id}')" style="background:var(--main);color:#fff;border:none;padding:8px 12px;border-radius:8px">Agregar</button>`;
     cont.appendChild(d);
   });
 });
}
function addToCart(cat,id){cart.push(menu[cat][id]);document.getElementById('cartCount').innerText=cart.length;alert("Agregado");}
function openCart(){
 if(cart.length==0)return alert("Carrito vacío");
 let total=cart.reduce((s,i)=>s+parseFloat(i.price),0);
 let txt=`Hola, quiero pedir:\n`+cart.map(i=>`- ${i.name} $${i.price}`).join('\n')+`\nTotal: $${total}`;
 if(confirm(txt+"\n\n¿Enviar por WhatsApp?")){
   const orderId=Date.now();
   const newOrder={id:orderId,items:cart,total:total,date:new Date().toLocaleString(),status:"nuevo"};
   if(db) db.ref('orders/'+orderId).set(newOrder);
   let wa=`https://wa.me/${cfg.phone}?text=${encodeURIComponent(txt)}`;
   window.open(wa,'_blank');cart=[];document.getElementById('cartCount').innerText=0;
 }
}
</script>
</head>
<body>
<header id="mainHeader">
<img id="logo" src="" style="display:none"><h1 id="bizName">Burger Kingo</h1><p id="bizAddr">Dolores Hidalgo</p>
</header>
<div id="menuContainer" style="padding:15px"></div>
<button id="cartBtn" onclick="openCart()">🛒 Ver Pedido (<span id="cartCount">0</span>)</button>
<div id="adminPanel" style="display:none;padding:15px;background:#fff;margin:15px;border-radius:10px">
<h2>ADMIN</h2>
<input id="cfgName" placeholder="Nombre negocio" style="width:100%;padding:8px;margin:5px 0"><br>
<input id="cfgAddr" placeholder="Dirección" style="width:100%;padding:8px;margin:5px 0"><br>
<input id="cfgPhone" placeholder="WhatsApp 52438..." style="width:100%;padding:8px;margin:5px 0"><br>
<input id="cfgColor" type="color" value="#ff4500"><label> Color</label><br>
<input id="cfgLogo" placeholder="URL Logo" style="width:100%;padding:8px;margin:5px 0"><br>
<button onclick="saveConfig()" style="width:100%;padding:10px;background:#000;color:#fff;border-radius:8px;margin-top:10px">💾 Guardar en la Nube</button>
<hr style="margin:15px 0">
<h3>Agregar Producto</h3>
<input id="pCat" placeholder="Categoría ej: Hamburguesas" style="width:100%;padding:8px;margin:5px 0">
<input id="pName" placeholder="Nombre producto" style="width:100%;padding:8px;margin:5px 0">
<input id="pPrice" placeholder="Precio" type="number" style="width:100%;padding:8px;margin:5px 0">
<button onclick="saveProduct()" style="width:100%;padding:10px;background:var(--main);color:#fff;border:none;border-radius:8px">Guardar Producto</button>
<hr style="margin:15px 0">
<h3>Pedidos en Vivo</h3>
<div id="ordersList"></div>
</div>
<script>
function openAdmin(){let u=prompt("Usuario:");let p=prompt("Contraseña:");if(u=="admin"&&p=="1234"){document.getElementById('adminPanel').style.display='block';renderAdminPanel();window.scrollTo(0,document.body.scrollHeight);}else alert("Datos incorrectos");}
function renderAdminPanel(){document.getElementById('cfgName').value=cfg.name;document.getElementById('cfgAddr').value=cfg.address;document.getElementById('cfgPhone').value=cfg.phone;document.getElementById('cfgColor').value=cfg.color;document.getElementById('cfgLogo').value=cfg.logoUrl||"";}
function saveConfig(){
 cfg.name=document.getElementById('cfgName').value;
 cfg.address=document.getElementById('cfgAddr').value;
 cfg.phone=document.getElementById('cfgPhone').value;
 cfg.color=document.getElementById('cfgColor').value;
 cfg.logoUrl=document.getElementById('cfgLogo').value;
 logoUrl=cfg.logoUrl;
 if(db) db.ref('config').set(cfg).then(()=>alert("✅ Sincronizado"));
 save();renderHeader();
}
function saveProduct(){
 let cat=document.getElementById('pCat').value||"General";
 let name=document.getElementById('pName').value;
 let price=document.getElementById('pPrice').value;
 if(!name||!price)return alert("Falta nombre o precio");
 if(!menu[cat])menu[cat]={};
 let id=Date.now();
 menu[cat][id]={name,price};
 if(db) db.ref('menu').set(menu).then(()=>alert("Producto en nube"));
 save();render();
 document.getElementById('pName').value="";document.getElementById('pPrice').value="";
}
function renderOrders(){
 const cont=document.getElementById('ordersList');if(!cont)return;cont.innerHTML="";
 Object.keys(orders).reverse().forEach(id=>{
   const o=orders[id];
   const d=document.createElement('div');d.style="border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:8px";
   d.innerHTML=`<b>#${o.id}</b> - ${o.date}<br>${(o.items||[]).map(i=>i.name).join(', ')}<br><b>Total $${o.total}</b>`;
   cont.appendChild(d);
 });
}
</script>
<div style="text-align:center;padding:20px"><button onclick="openAdmin()" style="background:none;border:none;color:#999;text-decoration:underline">Entrar como Admin</button></div>
<script>
try{let m=localStorage.getItem('menu');if(m)menu=JSON.parse(m);let c=localStorage.getItem('cfg');if(c)cfg=JSON.parse(c);}catch(e){}
renderHeader();render();
try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref('config').on('value', snap => { if (snap.exists()) { cfg = {...cfg,...snap.val() }; logoUrl = cfg.logoUrl||""; save();renderHeader();renderAdminPanel(); } });
  db.ref('menu').on('value', snap => { if (snap.exists()) { menu = snap.val(); save(); render(); } });
  db.ref('orders').on('value', snap => { if (snap.exists()) { orders = snap.val(); save(); renderOrders(); } else { orders={}; renderOrders(); } });
} catch(e){console.log("Error Firebase:", e);}
</script>
</body>
</html>
