<script>
const menuData={
  "Hamburguesas":[{name:"Clásica Sencilla",desc:"Carne 100% res",price:65,img:"https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=300"},{name:"Doble Queso",desc:"Doble carne",price:95,img:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=300"}],
  "Hot Dogs":[{name:"Hot Dog Clásico",desc:"Salchicha jumbo",price:35,img:"https://images.unsplash.com/photo-1551782450-a2132b4ba21d?w=300"}],
  "Papas":[{name:"Papas Francesa",desc:"Orden grande",price:45,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300"}],
  "Bebidas":[{name:"Refresco 600ml",desc:"Coca, Sprite",price:25,img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=300"}]
};
let categoriaActiva=Object.keys(menuData)[0];
let cantidades={};
let carrito={};
const restauranteCoords={lat:21.1556,lng:-100.9348};
let envioActual=0;
let distanciaKm=0;
function renderCategorias(){const d=document.getElementById("categories");d.innerHTML="";Object.keys(menuData).forEach(c=>{const b=document.createElement("button");b.className="cat-btn"+(c===categoriaActiva?" active":"");b.innerText=c;b.onclick=()=>{categoriaActiva=c;renderCategorias();renderProductos();};d.appendChild(b);});}
function renderProductos(){const d=document.getElementById("products");d.innerHTML="";menuData[categoriaActiva].forEach((p,i)=>{const id=categoriaActiva+"_"+i;if(cantidades[id]===undefined)cantidades[id]=0;d.innerHTML+=`<div class="product-card"><img class="product-img" src="${p.img}"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-desc">${p.desc}</div><div class="product-bottom"><div class="product-price">$${p.price}</div><div class="qty-control"><button class="qty-btn" onclick="cambiarQty('${id}',-1,'${p.name}',${p.price},'${p.img}')">−</button><div class="qty-num" id="qty_${id}">${cantidades[id]}</div><button class="qty-btn" onclick="cambiarQty('${id}',1,'${p.name}',${p.price},'${p.img}')">+</button></div></div></div></div>`;});}
function cambiarQty(id,delta,nombre,precio,img){let a=cantidades[id]||0;a+=delta;if(a<0)a=0;cantidades[id]=a;const el=document.getElementById("qty_"+id);if(el)el.innerText=a;if(a===0)delete carrito[id];else carrito[id]={nombre,precio,img,cant:a};actualizarBadge();if(window.renderCart)renderCart();if(window.actualizarResumenFinal)actualizarResumenFinal();}
function actualizarBadge(){document.getElementById("cartCount").innerText=Object.values(carrito).reduce((a,b)=>a+b.cant,0);}
renderCategorias();renderProductos();actualizarBadge();
</script>

<script>
const extras=[{name:"Refresco",price:25,img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=200"},{name:"Papas",price:45,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200"}];
let mapa=null,markerDir=null,markerGps=null,markerRest=null,polylineRuta=null,coordsMapa=null,debounceTimer=null;
// EJEMPLO CENTRO DOLORES HIDALGO
const ejemploCliente={lat:21.1578,lng:-100.9328};

function calcularDistancia(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}
function calcularPrecioEnvio(km){
  if(km<=0) return 0;
  if(km<=1) return 35;
  let extraKm=km-1;
  let bloques=Math.ceil(extraKm/0.75);
  return 35 + (bloques*5);
}
function renderCart(){
  const list=document.getElementById("cartList");
  const ids=Object.keys(carrito);
  if(ids.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:#777">Carrito vacío 🛒</div>';}
  else{
    list.innerHTML="";
    ids.forEach(id=>{
      const it=carrito[id];
      list.innerHTML+=`<div class="cart-item"><img src="${it.img}"><div class="cart-item-info"><div class="cart-item-name">${it.nombre} x${it.cant}</div><div class="cart-item-price">$${it.precio*it.cant}</div></div><div style="display:flex;gap:8px;align-items:center"><div class="qty-control"><button class="qty-btn" onclick="cambiarQty('${id}',-1,'${it.nombre}',${it.precio},'${it.img}')">−</button><div class="qty-num">${it.cant}</div><button class="qty-btn" onclick="cambiarQty('${id}',1,'${it.nombre}',${it.precio},'${it.img}')">+</button></div><button class="cart-del" onclick="eliminar('${id}')">🗑️</button></div></div>`;
    });
  }
  const addDiv=document.getElementById("addonsScroll");
  addDiv.innerHTML="";
  extras.forEach(e=>{addDiv.innerHTML+=`<div class="addon-card" onclick="addExtra('${e.name}',${e.price},'${e.img}')"><img src="${e.img}"><div class="addon-name">${e.name}</div><div class="addon-price">$${e.price}</div></div>`;});
  actualizarResumenFinal();
}
function addExtra(n,p,img){const id="extra_"+n;if(!carrito[id])carrito[id]={nombre:n,precio:p,img:img,cant:0};carrito[id].cant++;cantidades[id]=(cantidades[id]||0)+1;actualizarBadge();renderCart();}
function eliminar(id){delete carrito[id];cantidades[id]=0;const el=document.getElementById("qty_"+id);if(el)el.innerText=0;actualizarBadge();renderCart();}
window.abrirCarrito=function(){document.getElementById("cartOverlay").classList.add("show");document.getElementById("cartModal").classList.add("show");renderCart();}
window.cerrarCarrito=function(){document.getElementById("cartOverlay").classList.remove("show");document.getElementById("cartModal").classList.remove("show");}
window.abrirCheckout=function(){
  if(Object.keys(carrito).length===0){alert("Agrega productos");return;}
  cerrarCarrito();
  document.getElementById("checkoutModal").classList.add("show");
  setTimeout(()=>{
    initMap();
    // Cargar ejemplo inicial Centro Dolores
    coordsMapa=ejemploCliente;
    distanciaKm=calcularDistancia(restauranteCoords.lat,restauranteCoords.lng,coordsMapa.lat,coordsMapa.lng);
    envioActual=calcularPrecioEnvio(distanciaKm);
    dibujarRutaEjemplo();
    actualizarResumenFinal();
    actualizarInfoMapa();
  },400);
}
window.cerrarCheckout=function(){document.getElementById("checkoutModal").classList.remove("show");}
function initMap(){
  if(mapa){setTimeout(()=>{mapa.invalidateSize();},200);return;}
  mapa=L.map('map',{zoomControl:false}).setView([restauranteCoords.lat,restauranteCoords.lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
  L.control.zoom({position:'bottomright'}).addTo(mapa);
  markerRest=L.marker([restauranteCoords.lat,restauranteCoords.lng],{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7/images/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41]})}).addTo(mapa).bindPopup("BURGER KINGO - Restaurante");
}
function dibujarRutaEjemplo(){
  if(!mapa||!coordsMapa)return;
  if(markerDir)mapa.removeLayer(markerDir);
  if(polylineRuta)mapa.removeLayer(polylineRuta);
  markerDir=L.marker([coordsMapa.lat,coordsMapa.lng],{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7/images/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41]})}).addTo(mapa).bindPopup("Cliente - Centro Dolores");
  polylineRuta=L.polyline([[restauranteCoords.lat,restauranteCoords.lng],[coordsMapa.lat,coordsMapa.lng]],{color:'#25D366',weight:6,opacity:0.9,dashArray:'10,12'}).addTo(mapa);
  mapa.fitBounds([[restauranteCoords.lat,restauranteCoords.lng],[coordsMapa.lat,coordsMapa.lng]],{padding:[80,80]});
}
window.buscarDireccion=function(){
  const dir=document.getElementById("cliDir").value.trim();
  if(dir.length<6)return;
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>{
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir+", Dolores Hidalgo")}&limit=1`).then(r=>r.json()).then(d=>{
      if(d.length>0){
        const lat=parseFloat(d[0].lat),lon=parseFloat(d[0].lon);
        coordsMapa={lat:lat,lng:lon};
        distanciaKm=calcularDistancia(restauranteCoords.lat,restauranteCoords.lng,lat,lon);
        envioActual=calcularPrecioEnvio(distanciaKm);
        dibujarRutaEjemplo();
        actualizarResumenFinal();
        actualizarInfoMapa();
      }
    });
  },900);
}
function actualizarInfoMapa(){document.getElementById("infoKm").innerText=distanciaKm.toFixed(2)+" km";document.getElementById("infoEnvioMapa").innerText="$"+envioActual;document.getElementById("rKm").innerText=distanciaKm.toFixed(2)+" km";}
window.toggleGps=function(){
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude,lng=p.coords.longitude;
    coordsMapa={lat:lat,lng:lng};
    if(markerGps)mapa.removeLayer(markerGps);
    markerGps=L.marker([lat,lng],{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7/images/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41]})}).addTo(mapa);
    distanciaKm=calcularDistancia(restauranteCoords.lat,restauranteCoords.lng,lat,lng);
    envioActual=calcularPrecioEnvio(distanciaKm);
    dibujarRutaEjemplo();actualizarResumenFinal();actualizarInfoMapa();
  },()=>{alert("Activa GPS");});
}
window.actualizarResumenFinal=function(){
  const cant=Object.values(carrito).reduce((a,b)=>a+b.cant,0);
  const sub=Object.values(carrito).reduce((a,b)=>a+(b.precio*b.cant),0);
  const total=sub+envioActual;
  const e1=document.getElementById("rCant");
  if(e1){
    e1.innerText=cant;
    document.getElementById("rSub").innerText="$"+sub;
    document.getElementById("rEnvio").innerText="$"+envioActual;
    document.getElementById("rTotal").innerText="$"+total;
    document.getElementById("rKm").innerText=distanciaKm.toFixed(2)+" km";
  }
}
window.enviarFinal=function(){
  const nom=document.getElementById("cliNombre").value.trim();
  const tel=document.getElementById("cliTel").value.trim();
  const dir=document.getElementById("cliDir").value.trim();
  const ref=document.getElementById("cliRef").value.trim();
  if(!nom||!tel||!dir){alert("Llena nombre, teléfono y dirección");return;}
  if(!coordsMapa){alert("Escribe dirección válida");return;}
  const sub=Object.values(carrito).reduce((a,b)=>a+(b.precio*b.cant),0);
  const total=sub+envioActual;
  let msg=`*PEDIDO BURGER KINGO* 🍔\n\n👤 ${nom}\n📱 ${tel}\n🏠 ${dir}\n📍 Ref: ${ref||"Sin referencia"}\n📏 Distancia: ${distanciaKm.toFixed(2)} km - Trayectoria Restaurante → Casa\n🛵 Envío: $${envioActual}\n\n🛒 Productos:\n`;
  Object.values(carrito).forEach(i=>msg+=`• ${i.nombre} x${i.cant} = $${i.precio*i.cant}\n`);
  msg+=`\nSubtotal: $${sub}\nEnvío: $${envioActual}\n💰 TOTAL: $${total}\n\n📍 Ruta GPS:\nhttps://www.google.com/maps/dir/${restauranteCoords.lat},${restauranteCoords.lng}/${coordsMapa.lat},${coordsMapa.lng}\n`;
  window.open("https://wa.me/573242827963?text="+encodeURIComponent(msg),"_blank");
}
renderCart();
</script>
